<script>
/* ===================== PARÂMETROS PADRÃO ===================== */
const DEFAULT_PARAMS = {

  tolV: 0.10, tolMin: 1000,

/* [chave, item, grupo, peso %] — chaves fixas: não renomear (são usadas nos dados salvos) */
const GRUPOS = ['Fundação','Alvenaria','Laje','Platibanda','Instalações elétricas','Instalações hidrossanitárias','Reboco','Telhado','Contrapiso e calçadas'];
const ITENS = [
 ['marc','Marcação de obra','Fundação',1.0],
 ['esc','Escavação de estacas','Fundação',3.5],

 ['plat_alv',"Alvenaria da platibanda + cx d'água",'Platibanda',3.5],
 ['plat_ping','Pingadeiras da platibanda','Platibanda',0.5],
 ['ele_par','Infra elétrica paredes (tubulação + cx 4x2)','Instalações elétricas',1.5],
 ['ele_laje','Infra elétrica laje (eletrodutos + cx)','Instalações elétricas',2.0],
 ['hid_sanit','Instalações sanitárias sob piso','Instalações hidrossanitárias',2.5],

 ['hid_fossas','Fossas (calafete + concreto fundo)','Instalações hidrossanitárias',0.5],
 ['reb_plat',"Reboco platibanda + cx d'água",'Reboco',2.5],

 ['reb_req','Requadração','Reboco',2.0],
 ['reb_ext','Reboco externo','Reboco',3.0],
 ['reb_muro','Reboco muro frente','Reboco',1.5],
 ['tel_estr','Estrutura do telhado (acima da laje)','Telhado',3.5],
 ['tel_fibro','Telhamento fibrocimento','Telhado',1.5],
 ['tel_paraf','Parafusar telhas fibrocimento','Telhado',0.5],
 ['tel_mad_estr','Estrutura áreas de madeira','Telhado',1.5],
 ['tel_mad_telha','Telhamento áreas de madeira','Telhado',1.0],
 ['contrapiso','Contrapiso','Contrapiso e calçadas',4.5],
 ['calc_int','Calçadas internas (vaga, corredor, serviço)','Contrapiso e calçadas',2.0],
 ['calc_ext','Calçada externa (passeio)','Contrapiso e calçadas',2.0]
];
/* migração da Rev01 (avanço salvo por posição) */
const OLD_MAP = ['marc','esc','conc_est','bald','imp','hid_sanit','alv_casa','ele_par','laje_mont','ele_laje','laje_conc','plat_alv','alv_muro','portais','hid_ramais','reb_plat','tel_estr','tel_fibro','tel_paraf','tel_mad_estr','tel_mad_telha','reb_int','reb_req','reb_ext','reb_muro','hid_barr','hid_pluv','hid_cxi','hid_fossa_lig','hid_fossas','contrapiso',['calc_int','calc_ext']];
const EXTRAS = [
 {k:'arrimo',nm:'Arrimo (exceto fundação)',un:'m²',u:'arrimo'},
 {k:'muro',nm:'Muro extra – alvenaria',un:'m',u:'muro'},
 {k:'rebocoMuro',nm:'Muro extra – reboco por face',un:'m',u:'rebocoMuro'},
 {k:'calcada',nm:'Calçada extra (esquina)',un:'m²',u:'calcada'},
 {k:'tatil',nm:'Piso tátil',un:'m',u:'tatil'},
 {k:'fundMuro',nm:'Fundação muro/arrimo (verba)',un:'R$',u:null},
 {k:'outros',nm:'Outros (verba)',un:'R$',u:null}
];

/* ===================== ESTADO ===================== */
const DEMO = !firebaseConfig.projectId;
let db=null, auth=null, user=null, isAdmin=false;
let PARAMS = JSON.parse(JSON.stringify(DEFAULT_PARAMS));
let OBRAS = {};
let route = {v:'list'};
let unsub = [];
let IMPORT = null; // {rows:[...]} em revisão

/* ===================== UTIL ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = (v,d=0) => (v<0?'−':'')+'R$ '+Math.abs(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=0) => ((v||0)*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const num = v => { if(typeof v==='number') return v; const s=String(v??'').trim().replace(/\s|R\$/g,''); if(!s) return 0; const n=s.includes(',')?s.replace(/\./g,'').replace(',','.'):(/^-?\d{1,3}(\.\d{3})+$/.test(s)?s.replace(/\./g,''):s); const x=parseFloat(n); return isFinite(x)?x:0; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => iso(new Date());
const fmtDate = s => s ? s.split('-').reverse().join('/') : '';
const dayDiff = (a,b) => Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}

/* ===================== TÍTULO PADRÃO ===================== */
const pad2 = s => { s=String(s??'').trim().toUpperCase().replace(/^[QL]\s*/,''); return /^\d$/.test(s)?'0'+s:s; };
function tituloObra(o){
  const n=(o.nomeCurto||'').trim(), q=pad2(o.quadra), l=pad2(o.lote), b=(o.bairro||'').trim();
  if(!n && !q && !l && !b) return o.nome||'Obra sem nome';
  const parts=[n.toUpperCase()]; const ql=[q?'Q'+q:'',l?'L'+l:''].filter(Boolean).join(' ');
  if(ql) parts.push(ql); if(b) parts.push(b.toUpperCase());
  return parts.filter(Boolean).join(' - ');
}
function normalizeObra(o){
  // título: separa "NOME - Q112 L09 - BAIRRO" em campos, se ainda não separado
  if(!o.nomeCurto && !o.quadra && o.nome){
    const m=o.nome.match(/^(.*?)\s*-\s*Q\s*(\S+)\s+L\s*(\S+)\s*-\s*(.+)$/i);
    if(m){o.nomeCurto=m[1];o.quadra=m[2];o.lote=m[3];o.bairro=m[4];} else o.nomeCurto=o.nome;
  }
  // avanço: Rev01 (por posição) -> Rev02 (por chave)
  (o.casas||[]).forEach(c=>{
    if(!c.p2){ c.p2={}; const old=c.prog||{};
      Object.keys(old).forEach(i=>{const k=OLD_MAP[+i]; const v=num(old[i]); if(Array.isArray(k)) k.forEach(x=>c.p2[x]=v); else if(k) c.p2[k]=v;}); }
  });
  return o;
}

/* ===================== CÁLCULO ===================== */
function valorCasa(c){ const a=num(c.area); if(a<=0) return 0; return a*PARAMS.rm2 + (a<PARAMS.limPequena?PARAMS.adicPequena:0); }
function execCasa(c){ const v=valorCasa(c); let s=0; ITENS.forEach(it=>{ s+=(num(c.p2?.[it[0]])||0)*it[3]/100*v; }); return s; }
function extraValor(o,e){ const x=o.extras?.[e.k]||{}; const unit=e.u?PARAMS.unit[e.u]:1; return num(x.qtd)*unit; }
function prazoMeses(n){ const p=PARAMS.prazo; if(n<=1) return p.c1; if(n===2) return p.c2; if(n===3) return p.c3; if(n===4) return p.c4; return p.c4+(n-4)*p.extra; }
function calc(o){
  const casas=o.casas||[];
  const contratoCasas=casas.reduce((a,c)=>a+valorCasa(c),0);
  const execCasas=casas.reduce((a,c)=>a+execCasa(c),0);
  let contratoExtras=0, execExtras=0;
  EXTRAS.forEach(e=>{ const v=extraValor(o,e); contratoExtras+=v; execExtras+=v*(num(o.extras?.[e.k]?.pct)||0); });
  const contrato=contratoCasas+contratoExtras, exec=execCasas+execExtras;
  const meds=(o.medicoes||[]).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const pago=meds.reduce((a,m)=>a+num(m.pago),0);
  const semana=num(o.semana);
  const diff=pago+semana-exec;           // >0 pagamento à frente da obra; <0 empreiteiro com saldo a receber
  const tolV=Math.max(PARAMS.tolMin, PARAMS.tolV*exec);
  let st,tit,det;
  if(contrato<=0){st='na';tit='Sem contrato';det='Cadastre as áreas das casas na aba Dados da obra.';}
  else if(diff<=0){st='ok';tit='Pagamento dentro do executado';det=-diff>=1?`Empreiteiro com saldo a receber de ${brl(-diff)}.`:'Pago igual ao executado.';}
  else if(diff>tolV){st='bad';tit='Pagamento à frente da obra';det=`Pago + medição da semana passam o executado em ${brl(diff)} (${exec>0?pct(diff/exec):'—'} do executado). Conferir em obra antes de pagar.`;}
  else {st='warn';tit='Pagamento à frente da obra';det=`Diferença de ${brl(diff)} acima do executado (${exec>0?pct(diff/exec):'—'}). Double check do avanço.`;}
  const lib=Math.max(0, exec-pago);
  // prazo
  const n=casas.length, pm=prazoMeses(n), pdias=Math.round(pm*30.4);
  const ini=o.inicio || (meds[0]&&meds[0].data) || '';
  let prazo=null;
  if(ini && contrato>0){
    const dec=Math.max(0,dayDiff(ini,today())); const fim=new Date(ini+'T12:00'); fim.setDate(fim.getDate()+pdias);
    const pE=exec/contrato; const atraso=Math.round(dec - pE*pdias);
    prazo={ini,meses:pm,dias:pdias,fim:iso(fim),dec,pDec:dec/pdias,atraso,inicioInformado:!!o.inicio};
  }
  return {contrato,exec,pago,semana,diff,tolV,st,tit,det,lib,meds,prazo,
          saldo:contrato-pago, restante:contrato-exec,
          pExec: contrato?exec/contrato:0, pPago: contrato?pago/contrato:0, pSem: contrato?(pago+semana)/contrato:0};
}
function prazoTxt(p){
  if(!p) return {v:'–',cls:'',s:'informe o início do cinza (Dados da obra)'};
  const a=p.atraso;
  const v = a>3 ? `${a} dias de atraso` : (a<-3 ? `${-a} dias adiantada` : 'Em dia');
  const cls = a>15 ? 'bad' : (a>3 ? 'warn' : 'ok');
  return {v,cls,s:`${p.meses.toLocaleString('pt-BR')} meses · término ${fmtDate(p.fim)} · ${pct(Math.min(p.pDec,9.99))} do prazo`};
}

/* ===================== IMPORTAÇÃO MAIS CONTROLE ===================== */
function xlsDate(v){
  if(v instanceof Date) return iso(v);
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const m=String(v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function parseMaisControle(buf, o){
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  // o Mais Controle grava a dimensão da planilha errada: recalcula pelo conteúdo real
  let r0=1e9,c0=1e9,r1=0,c1=0;
  Object.keys(ws).forEach(k=>{ if(k[0]==='!') return; const a=XLSX.utils.decode_cell(k); r0=Math.min(r0,a.r);c0=Math.min(c0,a.c);r1=Math.max(r1,a.r);c1=Math.max(c1,a.c); });
  if(r1>0) ws['!ref']=XLSX.utils.encode_range({s:{r:r0,c:c0},e:{r:r1,c:c1}});
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const hi=rows.findIndex(r=>r.some(c=>norm(c)==='data') && r.some(c=>norm(c).startsWith('valor')));
  if(hi<0) throw new Error('Não achei o cabeçalho (Data / Valor) na planilha.');
  const h=rows[hi].map(norm), col=n=>h.findIndex(x=>x===n), colS=n=>h.findIndex(x=>x.startsWith(n));
  const cD=col('data'), cV=col('valor total')>=0?col('valor total'):colS('valor'), cP=colS('pago a'), cDe=colS('descri'), cC=colS('categoria');
  const exist=new Set((o.medicoes||[]).map(m=>m.data+'|'+num(m.pago).toFixed(2)));
  const out=[];
  rows.slice(hi+1).forEach(r=>{
    const data=xlsDate(r[cD]), valor=num(r[cV]); if(!data||!valor) return;
    const cat=cC>=0?String(r[cC]):'', desc=cDe>=0?String(r[cDe]):'', pagoA=cP>=0?String(r[cP]):'';
    const mo=/m[aã]o de obra/i.test(cat) && !/multa/i.test(desc);
    const dup=exist.has(data+'|'+valor.toFixed(2));
    out.push({data,valor,cat,desc,pagoA,dup,sel:mo&&!dup});
  });
  out.sort((a,b)=>a.data.localeCompare(b.data));
  return out;
}

function go(r){ route=r; IMPORT=null; window.scrollTo(0,0); render(); }
function ruler(pE,pP,pS,st){
  const solo=pP<0; if(solo){pP=0;pS=0;}
  pE=Math.max(0,Math.min(1,pE)); pP=Math.max(0,Math.min(1,pP)); pS=pS==null?pP:Math.max(0,Math.min(1,pS));
  const lo=Math.min(pE,pS), hi=Math.max(pE,pS), cls=pS>pE?('ahead'+(st==='warn'?' w':'')):'behind';
  return `<div class="ruler" role="img" aria-label="Executado ${pct(pE)}, pago ${pct(pP)}">
    <div class="ex" style="width:${pE*100}%"></div>
    ${!solo&&hi-lo>0.001?`<div class="gap ${cls}" style="left:${lo*100}%;width:${(hi-lo)*100}%"></div>`:''}
    ${solo?'':`<div class="pd" style="left:${pP*100}%"></div>`}
    ${!solo&&pS!==pP?`<div class="pd sem" style="left:${pS*100}%"></div>`:''}</div>`;
}

function historicoTab(id,o,c){
  if(IMPORT) return importView(o);
  let acc=0; const rows=c.meds.map(m=>{acc+=num(m.pago); const idx=(o.medicoes||[]).indexOf(m);
    return `<tr><td>${fmtDate(m.data)}</td><td class="r num">${brl(num(m.pago),2)}</td><td class="r num">${brl(acc,2)}</td><td class="r num">${m.exec!=null?brl(num(m.exec)):'–'}</td><td>${esc(m.obs||'')} ${m.origem==='mais controle'?'<span class="tag">Mais Controle</span>':''}</td><td>${(isAdmin||DEMO)?`<button class="del" data-delmed="${idx}" aria-label="Excluir">×</button>`:''}</td></tr>`;}).join('');
  return `<div class="card"><h3>Importar pagamentos do Mais Controle</h3>
    <p class="hint">Financeiro &gt; Lançamentos da obra, exportado em Excel. Lançamentos de "Mão de Obra" vêm marcados; os já lançados aqui (mesma data e valor) ficam desmarcados.</p>
    <div class="row-btns"><input type="file" id="impFile" accept=".xlsx,.xls,.csv"></div></div>
  <div class="card"><h3>Curva pago × executado</h3>${chart(c.meds,c)}</div>
  <div class="card"><h3>Pagamentos registrados</h3><div class="wrap"><table class="t"><thead><tr><th>Data</th><th class="r">Pago</th><th class="r">Acumulado</th><th class="r">Executado na data</th><th>Obs.</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="hint">Nenhum pagamento registrado.</td></tr>'}</tbody></table></div></div>`;
}
function importView(o){
  const rs=IMPORT.rows, tot=rs.filter(r=>r.sel).reduce((a,r)=>a+r.valor,0), n=rs.filter(r=>r.sel).length;
  return `<div class="card"><h3>Revisar importação · ${esc(IMPORT.file)}</h3>
    <p class="hint" style="margin-bottom:8px">Confira os lançamentos marcados. Só entram os marcados.</p>
    <div class="wrap"><table class="t"><thead><tr><th></th><th>Data</th><th class="r">Valor</th><th>Pago a</th><th>Descrição</th><th>Categoria</th></tr></thead><tbody>
    ${rs.map((r,i)=>`<tr class="${r.dup?'dup':''}"><td><input type="checkbox" data-imp="${i}" ${r.sel?'checked':''}></td><td>${fmtDate(r.data)}</td><td class="r num">${brl(r.valor,2)}</td><td>${esc(r.pagoA)}</td><td>${esc(r.desc)} ${r.dup?'<span class="tag">já lançado</span>':''}</td><td>${esc(r.cat)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="lib"><span>${n} lançamento(s) marcados</span><span class="v">${brl(tot,2)}</span></div>
    <div class="row-btns"><button class="btn blue" id="impOk" ${n?'':'disabled'}>Importar marcados</button><button class="btn ghost" id="impCancel">Cancelar</button></div></div>`;
}
function chart(meds,c){
  if(!meds.length) return '<p class="hint">O gráfico aparece a partir do primeiro pagamento registrado.</p>';
  const W=640,H=200,pl=48,pr=10,pt=10,pb=24, max=Math.max(c.contrato,1);
  let acc=0; const pts=meds.map(m=>{acc+=num(m.pago); return {d:m.data,p:acc,e:m.exec!=null?num(m.exec):null};});
  const n=pts.length, x=i=>pl+(n===1?0.5:i/(n-1))*(W-pl-pr), y=v=>pt+(1-v/max)*(H-pt-pb);
  const line=k=>pts.map((q,i)=>q[k]==null?null:`${x(i)},${y(q[k])}`).filter(Boolean).join(' ');
  const grid=[0,.25,.5,.75,1].map(g=>`<line x1="${pl}" x2="${W-pr}" y1="${y(g*max)}" y2="${y(g*max)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(g*max)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(g*100)}%</text>`).join('');
  const lbl=pts.map((q,i)=>(i===0||i===n-1||i%Math.ceil(n/6)===0)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtDate(q.d).slice(0,5)}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pago acumulado e executado">${grid}${lbl}
    <polyline fill="none" stroke="var(--ink)" stroke-width="2.5" points="${line('p')}"/>
    <polyline fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-dasharray="6 4" points="${line('e')}"/></svg>
    <div class="ruler-legend"><span><span class="sw" style="background:var(--ink)"></span>Pago acumulado</span><span><span class="sw" style="background:var(--blue)"></span>Executado na data do pagamento</span></div>`;
}
function dadosTab(id,o,c){
  const casas=(o.casas||[]).map((cs,k)=>`<tr><td><input class="w" data-cn="${k}" value="${esc(cs.nome||'')}"></td><td class="r"><input data-ca="${k}" inputmode="decimal" value="${cs.area!==''&&cs.area!=null?num(cs.area).toLocaleString('pt-BR'):''}" placeholder="m²"></td><td class="r num">${brl(valorCasa(cs),2)}</td><td><button class="del" data-delcasa="${k}" aria-label="Remover casa">×</button></td></tr>`).join('');
  const ex=EXTRAS.map(e=>`<tr><td>${esc(e.nm)}</td><td>${e.un}</td><td class="r"><input data-xq="${e.k}" inputmode="decimal" value="${o.extras?.[e.k]?.qtd?num(o.extras[e.k].qtd).toLocaleString('pt-BR'):''}"></td><td class="r num">${e.u?brl(PARAMS.unit[e.u],2):'verba'}</td><td class="r num">${brl(extraValor(o,e),2)}</td></tr>`).join('');
  const n=(o.casas||[]).length;
  return `<div class="card"><h3>Identificação</h3>${obraFields(o)}
    <p class="hint" style="margin-top:8px">Prazo do cinza para ${n} casa(s): ${prazoMeses(n).toLocaleString('pt-BR')} meses. Sem data de início, o prazo conta do primeiro pagamento.</p></div>
  <div class="card"><h3>Casas</h3><p class="hint" style="margin-bottom:8px">Área construída de cada casa pelo quadro de áreas do projeto aprovado.</p>
    <div class="wrap"><table class="t"><thead><tr><th>Casa</th><th class="r">Área (m²)</th><th class="r">Valor</th><th></th></tr></thead><tbody>${casas}</tbody></table></div>
    <div class="row-btns"><button class="btn ghost" id="addCasa">Adicionar casa</button></div></div>
  <div class="card"><h3>Serviços extras (fora da casa)</h3><p class="hint" style="margin-bottom:8px">Arrimo, muro e calçada além do padrão do lote (esquina), piso tátil. Verbas: digite o valor em R$ na quantidade.</p>
    <div class="wrap"><table class="t"><thead><tr><th>Serviço</th><th>Un.</th><th class="r">Qtd</th><th class="r">R$/un.</th><th class="r">Valor</th></tr></thead><tbody>${ex}</tbody></table></div></div>
  ${(isAdmin||DEMO)?`<div class="row-btns"><button class="btn danger" id="delObra">Excluir obra</button></div>`:''}`;
}
function paramsView(){
  const p=PARAMS, u=p.unit, z=p.prazo;
  const f=(k,l,v,h='')=>`<label class="f">${l}<input data-pk="${k}" inputmode="decimal" value="${String(v).replace('.',',')}">${h?`<span class="hint">${h}</span>`:''}</label>`;
  return `<button class="back" data-go="list">‹ Obras</button><div class="obra-title" style="margin-bottom:12px">Parâmetros</div>
  <p class="hint" style="margin-bottom:12px">Valem para todas as obras ao mesmo tempo.</p>
  <div class="card"><h3>Contrato</h3><div class="grid2">${f('rm2','R$/m² do cinza',p.rm2,'Real em 6 obras: R$ 383–397/m²')}${f('adicPequena','Adicional por casa pequena (R$)',p.adicPequena)}${f('limPequena','Limite casa pequena (m²)',p.limPequena)}</div></div>
  <div class="card"><h3>Prazo do cinza (meses)</h3><div class="grid2">${f('z.c1','1 casa',z.c1)}${f('z.c2','2 casas',z.c2)}${f('z.c3','3 casas',z.c3)}${f('z.c4','4 casas',z.c4)}${f('z.extra','A partir de 5 casas: + meses por casa',z.extra)}</div></div>
  <div class="card"><h3>Unitários de extras</h3><div class="grid2">${f('u.arrimo','Arrimo (R$/m²)',u.arrimo)}${f('u.muro','Muro alvenaria (R$/m)',u.muro)}${f('u.rebocoMuro','Reboco muro por face (R$/m)',u.rebocoMuro)}${f('u.calcada','Calçada (R$/m²)',u.calcada)}${f('u.tatil','Piso tátil (R$/m)',u.tatil)}</div></div>
  <div class="card"><h3>Alertas</h3><div class="grid2">${f('tolV','Vermelho acima de (fração do executado)',p.tolV,'0,10 = 10%. Entre 0 e esse limite: amarelo.')}${f('tolMin','Diferença mínima para vermelho (R$)',p.tolMin)}</div>
  <div class="row-btns"><button class="btn blue" id="saveParams">Salvar parâmetros</button><button class="btn ghost" id="resetParams">Restaurar padrão</button></div></div>`;
}

/* ===================== EVENTOS ===================== */
function bindFields(target, onSave){
  document.querySelectorAll('[data-f]').forEach(i=>{
    i.oninput=()=>{ target[i.dataset.f]=i.value; const pv=$('#tituloPrev'); if(pv) pv.textContent=tituloObra(target); };
    if(onSave) i.onchange=()=>onSave(i.dataset.f,i.value.trim());
  });
}
function bind(){
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go({v:'obra',id:b.dataset.open,tab:'vistoria',casa:0}));
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go({v:b.dataset.go}));
  const nb=$('#newBtn'); if(nb) nb.onclick=()=>go({v:'nova'});
  const pb=$('#paramsBtn'); if(pb) pb.onclick=()=>go({v:'params'});
  if(route.v==='nova'){
    bindFields(route.draft);
    $('#criarBtn').onclick=()=>{ const d=route.draft; if(!(d.nomeCurto||'').trim()){toast('Informe o nome da obra');return;} createObra(d); };
    return;
  }
  if(route.v==='params'){
    $('#saveParams').onclick=()=>{const p=JSON.parse(JSON.stringify(PARAMS)); document.querySelectorAll('[data-pk]').forEach(i=>{const k=i.dataset.pk, v=num(i.value); if(k.startsWith('u.')) p.unit[k.slice(2)]=v; else if(k.startsWith('z.')) p.prazo[k.slice(2)]=v; else p[k]=v;}); saveParams(p);};
    $('#resetParams').onclick=()=>{ if(confirm('Restaurar os parâmetros padrão?')) saveParams(JSON.parse(JSON.stringify(DEFAULT_PARAMS))); };
    return;
  }
  if(route.v!=='obra') return;
  const id=route.id, o=OBRAS[id];
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{route.tab=b.dataset.tab;IMPORT=null;render();});
  document.querySelectorAll('[data-casa]').forEach(b=>b.onclick=()=>{route.casa=+b.dataset.casa;render();});
  const k=Math.min(route.casa||0,(o.casas||[]).length-1);
  const setP=(fn)=>{const casas=o.casas.slice(); const cs={...casas[k],p2:{...(casas[k].p2||{})}}; fn(cs.p2); casas[k]=cs; saveSoon(id,{casas});};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setP(p=>p[b.dataset.p]=+b.dataset.v));
  document.querySelectorAll('[data-etapa]').forEach(b=>b.onclick=()=>setP(p=>ITENS.forEach(it=>{if(it[2]===b.dataset.etapa) p[it[0]]=1;})));
  const cp=document.querySelector('[data-copy]'); if(cp) cp.onclick=()=>{ if(!confirm('Copiar o avanço desta casa para todas as casas da obra?')) return; const src=o.casas[k].p2||{}; saveSoon(id,{casas:o.casas.map(c=>({...c,p2:{...src}}))}); toast('Avanço aplicado a todas as casas'); };
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const extras={...(o.extras||{})}; extras[b.dataset.x]={...(extras[b.dataset.x]||{}),pct:+b.dataset.v}; saveSoon(id,{extras});});
  const se=$('#semana'); if(se){ se.onchange=()=>saveObra(id,{semana:num(se.value)}); }
  const rb=$('#regBtn'); if(rb) rb.onclick=()=>{
    const pago=num($('#mPago').value), data=$('#mData').value; if(!pago||!data){toast('Informe data e valor pago');return;}
    const c=calc(o);
    const medicoes=[...(o.medicoes||[]), {data,solicitado:num(o.semana)||pago,pago,exec:Math.round(c.exec*100)/100,obs:$('#mObs').value.trim(),by:user?.email||'demo',em:Date.now()}];
    saveObra(id,{medicoes,semana:''}); toast('Pagamento registrado');
  };
  document.querySelectorAll('[data-delmed]').forEach(b=>b.onclick=()=>{ if(!confirm('Excluir este pagamento do histórico?')) return; saveObra(id,{medicoes:(o.medicoes||[]).filter((_,i)=>i!==+b.dataset.delmed)}); });
  if(route.tab==='dados') bindFields(o,(f,v)=>saveObra(id,{[f]:v}));
  document.querySelectorAll('[data-cn]').forEach(i=>i.onchange=()=>{const casas=o.casas.slice(); casas[+i.dataset.cn]={...casas[+i.dataset.cn],nome:i.value.trim()}; saveObra(id,{casas});});
  document.querySelectorAll('[data-ca]').forEach(i=>i.onchange=()=>{const casas=o.casas.slice(); casas[+i.dataset.ca]={...casas[+i.dataset.ca],area:num(i.value)}; saveObra(id,{casas});});
  document.querySelectorAll('[data-delcasa]').forEach(b=>b.onclick=()=>{ if(!confirm('Remover esta casa e o avanço lançado nela?')) return; route.casa=0; saveObra(id,{casas:o.casas.filter((_,i)=>i!==+b.dataset.delcasa)}); });
  const ac=$('#addCasa'); if(ac) ac.onclick=()=>{const n=(o.casas||[]).length+1; saveObra(id,{casas:[...(o.casas||[]),{nome:'Casa '+String(n).padStart(2,'0'),area:'',p2:{}}]});};
  document.querySelectorAll('[data-xq]').forEach(i=>i.onchange=()=>{const extras={...(o.extras||{})}; extras[i.dataset.xq]={...(extras[i.dataset.xq]||{}),qtd:num(i.value)}; saveObra(id,{extras});});
  const dl=$('#delObra'); if(dl) dl.onclick=()=>deleteObra(id);
  // importação
  const fi=$('#impFile'); if(fi) fi.onchange=async()=>{
    const f=fi.files[0]; if(!f) return;
    if(typeof XLSX==='undefined'){toast('Leitor de Excel não carregou. Recarregue a página.');return;}
    try{ const rows=parseMaisControle(await f.arrayBuffer(),o); if(!rows.length){toast('Nenhum lançamento encontrado no arquivo');return;} IMPORT={file:f.name,rows}; render(); }
    catch(e){ toast(e.message); }
  };
  document.querySelectorAll('[data-imp]').forEach(cb=>cb.onchange=()=>{IMPORT.rows[+cb.dataset.imp].sel=cb.checked; render();});
  const io=$('#impOk'); if(io) io.onclick=()=>{
    const add=IMPORT.rows.filter(r=>r.sel).map(r=>({data:r.data,solicitado:r.valor,pago:r.valor,exec:null,obs:[r.desc,r.pagoA].filter(Boolean).join(' · '),origem:'mais controle',by:user?.email||'demo',em:Date.now()}));
    IMPORT=null; saveObra(id,{medicoes:[...(o.medicoes||[]),...add]}); toast(add.length+' pagamento(s) importado(s)');
  };
  const ic=$('#impCancel'); if(ic) ic.onclick=()=>{IMPORT=null;render();};
}

/* ===================== AUTH / REALTIME ===================== */
function login(){ auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast('Login falhou: '+e.message)); }
function startRealtime(){
  unsub.forEach(f=>f()); unsub=[];
  unsub.push(db.collection('cinza_obras').onSnapshot(s=>{
    OBRAS={}; s.forEach(d=>OBRAS[d.id]=normalizeObra(d.data()));
    const ae=document.activeElement; if((ae&&ae.tagName==='INPUT'&&ae.type!=='checkbox'&&ae.type!=='file')||IMPORT) return; render();
  }, e=>toast('Sem acesso às obras: '+e.code)));
  unsub.push(db.collection('cinza_config').doc('params').onSnapshot(d=>{ if(d.exists){ const p=d.data(); PARAMS={...DEFAULT_PARAMS,...p,unit:{...DEFAULT_PARAMS.unit,...(p.unit||{})},prazo:{...DEFAULT_PARAMS.prazo,...(p.prazo||{})}}; } render(); }));
}
function init(){
  if(DEMO){ $('#demoBar').hidden=false; seedDemo(); render(); return; }
  firebase.initializeApp(firebaseConfig); auth=firebase.auth(); db=firebase.firestore();
  $('#outBtn').onclick=()=>auth.signOut();
  auth.onAuthStateChanged(u=>{
    if(u && ALLOWED_EMAILS.length && !ALLOWED_EMAILS.includes(u.email)){ toast('Conta sem acesso: '+u.email); auth.signOut(); return; }
    user=u; isAdmin=!!u && (ADMIN_EMAILS.length===0 || ADMIN_EMAILS.includes(u.email));
    $('#who').textContent=u?u.email:''; $('#outBtn').hidden=!u;
    if(u) startRealtime(); else { unsub.forEach(f=>f()); unsub=[]; OBRAS={}; render(); }
  });
}
init();
</script>
