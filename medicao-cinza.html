</div></header>

<script>
/* ===================== PARÂMETROS PADRÃO (espelham a planilha Rev01) ===================== */
const DEFAULT_PARAMS = {
  rm2: 410, adicPequena: 0, limPequena: 55,
  tolA: 0.05, tolV: 0.10, tolMin: 1000,
  unit: { arrimo:75, muro:86, rebocoMuro:40, calcada:18, tatil:12 }
};
const ITENS = [
 ['Marcação de obra','Fundação',1.0],['Escavação de estacas','Fundação',3.5],['Concretagem de estacas','Fundação',2.5],
 ['Baldrame (forma, armação, concreto)','Fundação',7.5],['Impermeabilização do baldrame','Fundação',1.5],
 ['Inst. sanitárias sob piso','Alvenaria e embutidos',2.5],['Alvenaria casa (vergas e contravergas)','Alvenaria e embutidos',17.0],
 ['Infra elétrica paredes (tubulação + cx 4x2)','Alvenaria e embutidos',1.5],
 ['Montagem da laje','Laje',5.0],['Infra elétrica laje (eletrodutos + cx)','Laje',2.0],['Concretagem da laje','Laje',4.0],
 ["Alvenaria platibanda + cx d'água",'Platibanda e muro',4.0],['Alvenaria muro (padrão do lote)','Platibanda e muro',4.0],
 ['Esquadrias de madeira (portais)','Embutidos',1.5],['Inst. hidráulicas casa (ramais)','Embutidos',3.0],
 ["Reboco platibanda + cx d'água",'Reboco',2.5],
 ['Estrutura do telhado (acima da laje)','Telhado',3.5],['Telhamento fibrocimento','Telhado',1.5],['Parafusar telhas','Telhado',0.5],
 ['Estrutura áreas de madeira','Telhado',1.5],['Telhamento áreas de madeira','Telhado',1.0],
 ['Reboco interno','Reboco',9.0],['Requadração','Reboco',2.0],['Reboco externo','Reboco',3.0],['Reboco muro frente','Reboco',1.5],
 ['Barrilete','Instalações finais',1.0],['Pluviais (prumada + cx recarga + rua)','Instalações finais',1.5],['Caixas de inspeção','Instalações finais',1.5],
 ['Fossa + sumidouro (ligações)','Instalações finais',0.5],['Fossas (calafete + concreto fundo)','Instalações finais',0.5],
 ['Contrapiso','Contrapiso e calçada',4.5],['Calçadas padrão do lote','Contrapiso e calçada',4.0]
];
const EXTRAS = [
 {k:'arrimo',nm:'Arrimo (exceto fundação)',un:'m²',u:'arrimo'},
 {k:'muro',nm:'Muro extra – alvenaria',un:'m',u:'muro'},
 {k:'rebocoMuro',nm:'Muro extra – reboco por face',un:'m',u:'rebocoMuro'},
 {k:'calcada',nm:'Calçada extra (esquina)',un:'m²',u:'calcada'},
 {k:'tatil',nm:'Piso tátil',un:'m',u:'tatil'},
 {k:'fundMuro',nm:'Fundação muro/arrimo (verba)',un:'R$',u:null},
 {k:'outros',nm:'Outros (verba)',un:'R$',u:null}
];

/* ===================== ESTADO ===================== */
const DEMO = !firebaseConfig.projectId;
let db=null, auth=null, user=null, isAdmin=false;
let PARAMS = JSON.parse(JSON.stringify(DEFAULT_PARAMS));
let OBRAS = {};           // id -> obra
let route = {v:'list'};   // {v:'list'} | {v:'obra',id,tab,casa}
let unsub = [];

/* ===================== UTIL ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = (v,d=0) => (v<0?'−':'')+'R$ '+Math.abs(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=0) => ((v||0)*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const num = v => { if(typeof v==='number') return v; const s=String(v??'').trim().replace(/\s|R\$/g,''); if(!s) return 0; const n=s.includes(',')?s.replace(/\./g,'').replace(',','.'):(/^-?\d{1,3}(\.\d{3})+$/.test(s)?s.replace(/\./g,''):s); const x=parseFloat(n); return isFinite(x)?x:0; };
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = s => s ? s.split('-').reverse().join('/') : '';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200);}

/* ===================== CÁLCULO ===================== */
function valorCasa(c){ const a=num(c.area); if(a<=0) return 0; return a*PARAMS.rm2 + (a<PARAMS.limPequena?PARAMS.adicPequena:0); }
function execCasa(c){ const v=valorCasa(c); let s=0; ITENS.forEach((it,i)=>{ s+=(num(c.prog?.[i])||0)*it[2]/100*v; }); return s; }
function extraValor(o,e){ const x=o.extras?.[e.k]||{}; const unit=e.u?PARAMS.unit[e.u]:1; return num(x.qtd)*unit; }
function calc(o){
  const casas=o.casas||[];
  const contratoCasas=casas.reduce((a,c)=>a+valorCasa(c),0);
  const execCasas=casas.reduce((a,c)=>a+execCasa(c),0);
  let contratoExtras=0, execExtras=0;
  EXTRAS.forEach(e=>{ const v=extraValor(o,e); contratoExtras+=v; execExtras+=v*(num(o.extras?.[e.k]?.pct)||0); });
  const contrato=contratoCasas+contratoExtras, exec=execCasas+execExtras;
  const meds=(o.medicoes||[]).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const pago=meds.reduce((a,m)=>a+num(m.pago),0);
  const semana=num(o.semana);
  const diff=pago+semana-exec;
  const tolA=Math.max(PARAMS.tolMin, PARAMS.tolA*exec), tolV=Math.max(2*PARAMS.tolMin, PARAMS.tolV*exec);
  let st='ok', tit='Medição compatível', det='Pago + medição da semana dentro da tolerância do executado.';
  if(contrato<=0){st='na';tit='Sem contrato';det='Cadastre as áreas das casas na aba Dados.';}
  else if(diff>tolV){st='bad';tit='Medição à frente da obra';det=`Pago + medição da semana passam o executado em ${brl(diff)}. Conferir em obra antes de pagar.`;}
  else if(diff>tolA){st='warn';tit='Medição à frente da obra';det=`Diferença de ${brl(diff)} acima do executado. Double check do avanço.`;}
  else if(-diff>tolV){st='bad';tit='Empreiteiro com saldo a receber';det=`Executado ${brl(-diff)} acima do pago. Medição atrasada ou avanço lançado a maior.`;}
  else if(-diff>tolA){st='warn';tit='Empreiteiro com saldo a receber';det=`Executado ${brl(-diff)} acima do pago.`;}
  const lib=Math.max(0, exec+tolA-pago);
  const last4=meds.slice(-4).map(m=>num(m.pago)); const media=last4.length?last4.reduce((a,b)=>a+b,0)/last4.length:0;
  const saldo=contrato-pago, restante=contrato-exec;
  return {contrato,exec,pago,semana,diff,tolA,tolV,st,tit,det,lib,media,saldo,restante,meds,
          semSaldo: media>0? saldo/media : 0, pExec: contrato?exec/contrato:0, pPago: contrato?pago/contrato:0, pSem: contrato?(pago+semana)/contrato:0};
}

/* ===================== DADOS (Firebase ou demo) ===================== */
function newObra(nome){ return {nome, empreiteiro:'', engenheiro:'', casas:[{nome:'Casa 01',area:'',prog:{}}], extras:{}, medicoes:[], semana:'', criadoEm:Date.now()}; }
async function saveObra(id, patch){
  const o=OBRAS[id]; Object.assign(o,patch); o.updatedAt=Date.now(); o.updatedBy=user?.email||'demo';
  if(DEMO){ render(); return; }
  try{ await db.collection('cinza_obras').doc(id).set(JSON.parse(JSON.stringify(o)),{merge:true}); }
  catch(e){ toast('Não salvou: '+e.message); }
}
let saveTimer={};

/* ===================== RENDER ===================== */
function ruler(pE,pP,pS){
  const solo=pP<0; if(solo){pP=0;pS=0;}
  pE=Math.max(0,Math.min(1,pE)); pP=Math.max(0,Math.min(1,pP)); pS=pS==null?pP:Math.max(0,Math.min(1,pS));
  const lo=Math.min(pE,pS), hi=Math.max(pE,pS), cls=pS>pE?'ahead':'behind';
  return `<div class="ruler" role="img" aria-label="Executado ${pct(pE)}, pago ${pct(pP)}${pS!==pP?', pago mais pedido '+pct(pS):''}">
    <div class="ex" style="width:${pE*100}%"></div>
    ${!solo&&hi-lo>0.001?`<div class="gap ${cls}" style="left:${lo*100}%;width:${(hi-lo)*100}%"></div>`:''}
    ${solo?'':`<div class="pd" style="left:${pP*100}%"></div>`}
    ${!solo&&pS!==pP?`<div class="pd sem" style="left:${pS*100}%"></div>`:''}</div>`;
}

function chart(meds,c){
  if(!meds.length) return '<p class="hint">O gráfico aparece a partir do primeiro pagamento registrado.</p>';
  const W=640,H=200,pl=48,pr=10,pt=10,pb=24, max=Math.max(c.contrato,1);
  let acc=0; const pts=meds.map(m=>{acc+=num(m.pago); return {d:m.data,p:acc,e:m.exec!=null?num(m.exec):null};});
  const n=pts.length, x=i=>pl+(n===1?0.5:i/(n-1))*(W-pl-pr), y=v=>pt+(1-v/max)*(H-pt-pb);
  const line=(k)=>pts.map((q,i)=>q[k]==null?null:`${x(i)},${y(q[k])}`).filter(Boolean).join(' ');
  const grid=[0,.25,.5,.75,1].map(g=>`<line x1="${pl}" x2="${W-pr}" y1="${y(g*max)}" y2="${y(g*max)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(g*max)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(g*100)}%</text>`).join('');
  const lbl=pts.map((q,i)=> (i===0||i===n-1||i%Math.ceil(n/6)===0)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtDate(q.d).slice(0,5)}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pago acumulado e executado por data">${grid}${lbl}
    <polyline fill="none" stroke="var(--ink)" stroke-width="2.5" points="${line('p')}"/>
    <polyline fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-dasharray="6 4" points="${line('e')}"/></svg>
    <div class="ruler-legend"><span><span class="sw" style="background:var(--ink)"></span>Pago acumulado</span><span><span class="sw" style="background:var(--blue)"></span>Executado na data do pagamento</span></div>`;
}

function bind(){
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go({v:'obra',id:b.dataset.open,tab:'vistoria',casa:0}));
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go({v:b.dataset.go}));
  const nb=$('#newBtn'); if(nb) nb.onclick=()=>{const n=prompt('Nome da obra (ex.: IS 9 – Q08 L05 NSA)'); if(n&&n.trim()) createObra(n.trim());};
  const pb=$('#paramsBtn'); if(pb) pb.onclick=()=>go({v:'params'});
  if(route.v==='params'){
    $('#saveParams').onclick=()=>{const p=JSON.parse(JSON.stringify(PARAMS)); document.querySelectorAll('[data-pk]').forEach(i=>{const k=i.dataset.pk, v=num(i.value); if(k.startsWith('u.')) p.unit[k.slice(2)]=v; else p[k]=v;}); saveParams(p);};
    $('#resetParams').onclick=()=>{ if(confirm('Restaurar os parâmetros padrão da Rev01?')) saveParams(JSON.parse(JSON.stringify(DEFAULT_PARAMS))); };
    return;
  }
  if(route.v!=='obra') return;
  const id=route.id, o=OBRAS[id];
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{route.tab=b.dataset.tab;render();});
  document.querySelectorAll('[data-casa]').forEach(b=>b.onclick=()=>{route.casa=+b.dataset.casa;render();});
  const k=Math.min(route.casa||0,(o.casas||[]).length-1);
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const casas=o.casas.slice(); const cs={...casas[k],prog:{...(casas[k].prog||{})}}; cs.prog[b.dataset.p]=+b.dataset.v; casas[k]=cs; saveSoon(id,{casas});});
  document.querySelectorAll('[data-etapa]').forEach(b=>b.onclick=()=>{const casas=o.casas.slice(); const cs={...casas[k],prog:{...(casas[k].prog||{})}}; ITENS.forEach((it,i)=>{if(it[1]===b.dataset.etapa) cs.prog[i]=1;}); casas[k]=cs; saveSoon(id,{casas});});
  const cp=document.querySelector('[data-copy]'); if(cp) cp.onclick=()=>{ if(!confirm('Copiar o avanço desta casa para todas as casas da obra?')) return; const src=o.casas[k].prog||{}; const casas=o.casas.map(c=>({...c,prog:{...src}})); saveSoon(id,{casas}); toast('Avanço aplicado a todas as casas'); };
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const extras={...(o.extras||{})}; extras[b.dataset.x]={...(extras[b.dataset.x]||{}),pct:+b.dataset.v}; saveSoon(id,{extras});});
  const se=$('#semana'); if(se){ se.oninput=()=>{OBRAS[id].semana=num(se.value);}; se.onchange=()=>saveObra(id,{semana:num(se.value)}); }
  const rb=$('#regBtn'); if(rb) rb.onclick=()=>{
    const pago=num($('#mPago').value), data=$('#mData').value; if(!pago||!data){toast('Informe data e valor pago');return;}
    const c=calc(o);
    const medicoes=[...(o.medicoes||[]), {data,solicitado:num(o.semana)||pago,pago,exec:Math.round(c.exec*100)/100,obs:$('#mObs').value.trim(),by:user?.email||'demo',em:Date.now()}];
    saveObra(id,{medicoes,semana:''}); toast('Pagamento registrado');
  };
  document.querySelectorAll('[data-delmed]').forEach(b=>b.onclick=()=>{ if(!confirm('Excluir este pagamento do histórico?')) return; const medicoes=(o.medicoes||[]).filter((_,i)=>i!==+b.dataset.delmed); saveObra(id,{medicoes}); });
  document.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>saveObra(id,{[i.dataset.f]:i.value.trim()}));
  document.querySelectorAll('[data-cn]').forEach(i=>i.onchange=()=>{const casas=o.casas.slice(); casas[+i.dataset.cn]={...casas[+i.dataset.cn],nome:i.value.trim()}; saveObra(id,{casas});});
  document.querySelectorAll('[data-ca]').forEach(i=>i.onchange=()=>{const casas=o.casas.slice(); casas[+i.dataset.ca]={...casas[+i.dataset.ca],area:num(i.value)}; saveObra(id,{casas});});
  document.querySelectorAll('[data-delcasa]').forEach(b=>b.onclick=()=>{ if(!confirm('Remover esta casa e o avanço lançado nela?')) return; const casas=o.casas.filter((_,i)=>i!==+b.dataset.delcasa); route.casa=0; saveObra(id,{casas}); });
  const ac=$('#addCasa'); if(ac) ac.onclick=()=>{const n=(o.casas||[]).length+1; saveObra(id,{casas:[...(o.casas||[]),{nome:'Casa '+String(n).padStart(2,'0'),area:'',prog:{}}]});};
  document.querySelectorAll('[data-xq]').forEach(i=>i.onchange=()=>{const extras={...(o.extras||{})}; extras[i.dataset.xq]={...(extras[i.dataset.xq]||{}),qtd:num(i.value)}; saveObra(id,{extras});});
  const dl=$('#delObra'); if(dl) dl.onclick=()=>deleteObra(id);
}

/* ===================== AUTH / REALTIME ===================== */
function login(){ const p=new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(e=>toast('Login falhou: '+e.message)); }
function startRealtime(){
  unsub.forEach(f=>f()); unsub=[];
  unsub.push(db.collection('cinza_obras').onSnapshot(s=>{ OBRAS={}; s.forEach(d=>OBRAS[d.id]=d.data()); const ae=document.activeElement; if(ae&&ae.tagName==='INPUT') return; render(); }, e=>toast('Sem acesso às obras: '+e.code)));
  unsub.push(db.collection('cinza_config').doc('params').onSnapshot(d=>{ if(d.exists){ const p=d.data(); PARAMS={...DEFAULT_PARAMS,...p,unit:{...DEFAULT_PARAMS.unit,...(p.unit||{})}}; } render(); }));
}
function init(){
  if(DEMO){ $('#demoBar').hidden=false; seedDemo(); render(); return; }
  firebase.initializeApp(firebaseConfig); auth=firebase.auth(); db=firebase.firestore();
  $('#outBtn').onclick=()=>auth.signOut();
  auth.onAuthStateChanged(u=>{
    if(u && ALLOWED_EMAILS.length && !ALLOWED_EMAILS.includes(u.email)){ toast('Conta sem acesso: '+u.email); auth.signOut(); return; }
    user=u; isAdmin=!!u && (ADMIN_EMAILS.length===0 || ADMIN_EMAILS.includes(u.email));
    $('#who').textContent=u?u.email:''; $('#outBtn').hidden=!u;
    if(u) startRealtime(); else { unsub.forEach(f=>f()); unsub=[]; OBRAS={}; render(); }
  });
}
init();
</script>
