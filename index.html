<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lote de Pagamento – IS Engenharia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1c1f1a; --muted:#6b6d66; --line:#dcd8cf;
  --verde:#1a3a2a; --verde2:#2d5c42; --verde-lt:#e6f0e9; --ouro:#b8943c; --ouro-lt:#f7efdb;
  --alerta:#a33a2a; --alerta-lt:#f8e3de; --ok:#1f6b3d;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121512; --surface:#1b201c; --ink:#ecebe6; --muted:#a3a59d; --line:#2f3530;
  --verde:#2f6b4b; --verde2:#3f8a61; --verde-lt:#1f2e25; --ouro:#d1ad55; --ouro-lt:#2d2718;
  --alerta:#e2735f; --alerta-lt:#3a211c; --ok:#6cc48f;}}
:root[data-theme="dark"]{
  --bg:#121512; --surface:#1b201c; --ink:#ecebe6; --muted:#a3a59d; --line:#2f3530;
  --verde:#2f6b4b; --verde2:#3f8a61; --verde-lt:#1f2e25; --ouro:#d1ad55; --ouro-lt:#2d2718;
  --alerta:#e2735f; --alerta-lt:#3a211c; --ok:#6cc48f;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 120px}

.top{background:var(--verde);color:#fff;border-radius:14px;padding:16px 18px 14px;margin-bottom:12px}
.top h1{font-family:var(--cond);font-weight:700;font-size:26px;margin:0;letter-spacing:.2px}
.top .sub{font-size:13px;opacity:.8;margin-top:2px}
.demo{display:inline-block;background:var(--ouro);color:#1a3a2a;font-weight:600;font-size:12px;border-radius:6px;padding:2px 8px;margin-top:8px}
.janela{display:flex;gap:6px;margin-top:12px}
.janela button{flex:1;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:7px 0;font-weight:600;font-size:14px}
.janela button[aria-pressed="true"]{background:#fff;color:var(--verde);border-color:#fff}

.modo{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.modo button{flex:1;border:0;background:transparent;border-radius:8px;padding:10px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.modo button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.sync{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 2px 12px}
.sync button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px}

.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.resumo div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.resumo b{display:block;font-family:var(--cond);font-size:22px;font-weight:700}
.resumo span{font-size:12px;color:var(--muted)}
.resumo .warn b{color:var(--alerta)}

.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item.pend{border-color:var(--alerta);box-shadow:inset 4px 0 0 var(--alerta)}
.item.ok{box-shadow:inset 4px 0 0 var(--ok)}
.item.rec{opacity:.55}
.linha1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.forn{font-weight:600}
.valor{font-family:var(--cond);font-weight:700;font-size:20px;white-space:nowrap}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.campos{display:grid;gap:8px;margin-top:10px}
.campo label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.campo .val{font-size:14px;padding:7px 10px;background:var(--bg);border-radius:8px;word-break:break-all}
.campo input,.campo select{width:100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--alerta);background:var(--alerta-lt);color:var(--ink);border-radius:8px}
.auto{font-size:11px;color:var(--ok);font-weight:600;margin-left:6px}
.aviso{font-size:13px;color:var(--alerta);font-weight:600;margin-top:8px}
.acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.ouro{background:var(--ouro);border-color:var(--ouro);color:#1a3a2a}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.acoes select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--surface);color:var(--ink)}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px}
.tag.ok{background:var(--verde-lt);color:var(--ok)}
.tag.rec{background:var(--alerta-lt);color:var(--alerta)}

/* Iago */
.progresso{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.barra{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--verde2);transition:width .3s}
.conta{border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);background:var(--surface)}
.conta-h{background:var(--verde);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.conta-h h2{font-family:var(--cond);font-size:20px;margin:0;font-weight:700}
.conta-h .tot{text-align:right;font-size:12px;opacity:.85}
.conta-h .tot b{display:block;font-family:var(--cond);font-size:20px;opacity:1}
.conta.feita .conta-h{background:var(--muted)}
.pg{padding:12px 14px;border-top:1px solid var(--line)}
.pg:first-of-type{border-top:0}
.pg.pago{opacity:.5}
.copiar{display:flex;align-items:center;gap:8px;margin-top:8px}
.copiar .val{flex:1;font-size:14px;padding:8px 10px;background:var(--bg);border-radius:8px;word-break:break-all}
.copiar .btn{padding:8px 12px;flex-shrink:0}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--verde)}

.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.rodape .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.rodape .info{flex:1;font-size:13px;color:var(--muted)}
.rodape .info b{display:block;color:var(--ink);font-family:var(--cond);font-size:18px}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.on{display:flex}
.sheet .box{background:var(--surface);width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;display:flex;flex-direction:column}
.sheet h3{margin:0 0 8px;font-family:var(--cond);font-size:22px}
.sheet pre{flex:1;overflow:auto;background:var(--bg);border-radius:10px;padding:12px;font-family:var(--font);font-size:14px;white-space:pre-wrap;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.imp{background:var(--surface);border:1px dashed var(--ouro);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.imp p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.imp .acoes{margin-top:0}
.imp label.btn{display:inline-block}
.mapa-g{display:grid;gap:8px;overflow:auto;margin-bottom:12px}
.mapa-g label{font-size:13px;font-weight:600}
.mapa-g select{width:100%;font:inherit;font-size:14px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.venc-alerta{color:var(--alerta);font-weight:700}
.vazio{text-align:center;color:var(--muted);padding:30px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Lote de pagamento</h1>
    <div class="sub" id="hoje"></div>
    <span class="demo" id="selo">Nenhum lote importado</span>
    <div class="janela" role="group" aria-label="Janela de pagamento">
      <button id="j12" aria-pressed="true">Lote das 12h</button>
      <button id="j18" aria-pressed="false">Lote das 18h</button>
    </div>
  </header>

  <div class="modo" role="group" aria-label="Quem está usando">
    <button id="mEmily" aria-pressed="true">Emily · conferir</button>
    <button id="mIago" aria-pressed="false">Iago · pagar</button>
    <button id="mHist" aria-pressed="false">Histórico</button>
  </div>

  <main id="app"></main>
</div>

<div class="rodape" id="rodape"><div class="in">
  <div class="info" id="rodInfo"></div>
  <button class="btn ouro" id="btnLote">Gerar mensagem do lote</button>
</div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="box">
    <h3 id="shT">Mensagem do lote</h3>
    <pre id="msg"></pre>
    <div class="acoes">
      <button class="btn pri" id="cpMsg">Copiar mensagem</button>
      <button class="btn" id="fechar">Fechar</button>
    </div>
  </div>
</div>
<div class="sheet" id="mapa" role="dialog" aria-modal="true" aria-labelledby="mpT">
  <div class="box">
    <h3 id="mpT">Conferir colunas do arquivo</h3>
    <div class="meta" id="mpInfo" style="margin-bottom:10px"></div>
    <div class="mapa-g" id="mpCampos"></div>
    <div class="acoes"><button class="btn pri" id="mpOk">Importar</button><button class="btn" id="mpCancel">Cancelar</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
//  CONFIGURAÇÃO DO FIREBASE — cole aqui o bloco firebaseConfig do seu projeto
//  (Configurações do projeto → Seus apps → App da Web → SDK setup → Config)
// =====================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCd55O3J1sH8vZqD5f-IwIDCjkA16clan8",
  authDomain: "is-lote-pagamentos.firebaseapp.com",
  projectId: "is-lote-pagamentos",
  storageBucket: "is-lote-pagamentos.firebasestorage.app",
  messagingSenderId: "964029495673",
  appId: "1:964029495673:web:2aca494c5747912dc6d7a8"
};
// Quem pode entrar (precisa bater com as regras do Firestore)
const USUARIOS = {
  "iago.egma@gmail.com": "Iago",
  "is.engenhariago@gmail.com": "Emily"
};
// =====================================================================
// ---------- CADASTROS (na versão real: abas Obras / Contas / Fornecedores) ----------
const OBRA_CONTA = { "IS 7":"IS Engenharia – Nubank", "Rodrigo 2":"Rodrigo – Caixa", "TML 1":"Investidor TML – Itaú", "IS 8":"" };
let FORNECEDORES = {
  "Derciel Tijolos":      {fav:"Geovanna Gonçalves Santos", chave:"CPF 054.718.581-23"},
  "Pedra Nobre Marmoraria":{fav:"Pedra Nobre Marmoraria Ltda", chave:"CNPJ 11.222.333/0001-44"},
  "BP Ferro e Aço":       {fav:"BP Ferro e Aço", chave:"CNPJ 48.898.693/0001-08"},
  "Depósito Real":        {fav:"Depósito Real Materiais", chave:"financeiro@depositoreal.com.br"},
  "Concreteira Central":  {fav:"Concreteira Central", chave:""},
  "Gesso Ideal":          {fav:"Gesso Ideal Ltda", chave:"CNPJ 22.333.444/0001-55"}
};
// ---------- CONTAS A PAGAR EM ABERTO (na versão real: puxadas da API do Mais Controle) ----------
const MC = [
 {id:1, oc:"OC 1482", obra:"IS 7",      forn:"Derciel Tijolos",        desc:"Alvenaria – tijolos",            valor:7700, tipo:"Pix", sol:"Guilherme"},
 {id:2, oc:"OC 1485", obra:"Rodrigo 2", forn:"Pedra Nobre Marmoraria", desc:"Bancadas área gourmet – final",  valor:705,  tipo:"Pix", sol:"Guilherme"},
 {id:3, oc:"OC 1486", obra:"TML 1",     forn:"BP Ferro e Aço",         desc:"Superestrutura – aço",           valor:1240, tipo:"Pix", sol:"Guilherme"},
 {id:4, oc:"OC 1487", obra:"IS 7",      forn:"Concreteira Central",    desc:"Concreto usinado – laje",        valor:3850, tipo:"Boleto", venc:"30/09", linha:"23793.38128 60082.345678 90000.123456 1 95430000385000", sol:"Guilherme"},
 {id:5, oc:"Avulso",  obra:"Rodrigo 2", forn:"José Eletricista",       desc:"Mão de obra elétrica – medição 2",valor:1800, tipo:"Pix", sol:"Igor"},
 {id:6, oc:"OC 1490", obra:"IS 8",      forn:"Depósito Real",          desc:"Cimento e argamassa",            valor:2310, tipo:"Pix", sol:"Guilherme"},
 {id:7, oc:"OC 1491", obra:"TML 1",     forn:"Gesso Ideal",            desc:"Forro de gesso – medição 1",     valor:2640, tipo:"Pix", sol:"Guilherme", avulsa:"7d9f2a1c-4b3e-4f8a-9c21-5e6d7a8b9c0d", conf:true}
];
function contasLista(){ return [...new Set([...Object.values(OBRA_CONTA), ...st.itens.map(i=>i.contaMC)].filter(Boolean))].sort(); }
const norm = s => String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
let FORN_IDX = {};
function indexarForn(){ FORN_IDX={}; for(const [n,v] of Object.entries(FORNECEDORES)) FORN_IDX[norm(n)]=v; }
indexarForn();
function fornCad(it){ return it.chaveCad ? {chave:it.chaveCad, fav:it.favCad||""} : (FORN_IDX[norm(it.forn)] || {}); }
function novoItem(x){ return {...x, contaManual:"", chaveManual:"", favManual:"", linhaManual:"", chaveAvulsa:x.avulsa||"", confirmada:!!x.conf, editando:false, status:"aberto", motivo:"", pago:false}; }

// estado
const st = { modo:"emily", janela:"12h", itens: [], fonte:"mc", arquivo:"", importadoEm:"" };
for(const k in OBRA_CONTA) delete OBRA_CONTA[k]; FORNECEDORES={}; indexarForn();

const $ = s => document.querySelector(s);
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function conta(it){ return it.contaManual || it.contaMC || OBRA_CONTA[it.obra] || ""; }
function chave(it){ if(it.tipo==="Boleto") return it.linha||it.linhaManual||""; return it.chaveAvulsa || it.pixLanc || it.chaveManual || fornCad(it).chave || ""; }
function fav(it){ return it.favManual || it.favLanc || fornCad(it).fav || (chave(it)?it.forn:""); }
function pronto(it){ if(it.chaveAvulsa && !it.confirmada) return false; return conta(it) && chave(it) && (it.tipo==="Boleto" || fav(it)); }
function duplicado(it){ const k=chave(it); if(!k || !(it.tipo==="Boleto" || /^000201/.test(k))) return null;
  return st.itens.find(o=>o!==it && o.status!=="recusado" && chave(o)===k) || null; }
function alertaHist(it, paraIago){ const j=it.jaPago; if(!j) return "";
  if(!j.exato && paraIago) return "";
  const d=j.em?new Date(j.em):null, quando=d?d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
  if(j.exato) return `<div class="aviso" style="margin-top:8px">⚠ Este mesmo lançamento já foi pago ${quando?"em "+quando:""}${j.por?" por "+esc(nome(j.por)):""} · ${brl(j.valor)}. Verifique se a baixa foi dada no Mais Controle.</div>`;
  return `<div class="meta" style="margin-top:8px;color:var(--ouro);font-weight:600">Double check: pagamento parecido (mesmo fornecedor, valor e obra) pago ${quando?"em "+quando:""}${j.desc?" · "+esc(j.desc):""}. Se for uma nova medição, é só conferir normalmente.</div>`; }
function alertaCC(it){ const k=chave(it); const d=duplicado(it);
  const dup = d ? `⚠ Mesmo código usado em outro pagamento: ${d.forn} · ${brl(d.valor)} · ${d.obra}` : "";
  if(it.tipo==="Boleto"||!/^000201/.test(k)) return dup?`<div class="meta" style="color:var(--alerta);font-weight:600;margin-top:6px">${esc(dup)}</div>`:"";
  const e=emv(k)||{}; let a=dup?[dup]:[];
  if(e.valor!=null && Math.abs(e.valor-it.valor)>0.009) a.push(`⚠ Valor dentro do código: ${brl(e.valor)} (lançamento: ${brl(it.valor)})`);
  if(e.dinamico) a.push("Código dinâmico: pode expirar, pagar no mesmo dia");
  if(e.nome){ const n1=norm(e.nome).split(" ")[0], f1=norm(it.forn).split(" ")[0];
    a.push((n1&&f1&&n1!==f1?"⚠ Recebedor no código diferente do fornecedor: ":"Recebedor no código: ")+e.nome); }
  a.sort((x,y)=>(y.startsWith("⚠")?1:0)-(x.startsWith("⚠")?1:0));
  return a.length?`<div class="meta" style="color:${a[0].startsWith("⚠")?"var(--alerta)":"var(--muted)"};font-weight:600;margin-top:6px">${a.map(esc).join("<br>")}</div>`:""; }
function cpfValido(c){ if(!/^\d{11}$/.test(c)||/^(\d)\1{10}$/.test(c)) return false;
  let s=0; for(let i=0;i<9;i++) s+=+c[i]*(10-i); let d1=(s*10)%11%10; if(d1!==+c[9]) return false;
  s=0; for(let i=0;i<10;i++) s+=+c[i]*(11-i); return (s*10)%11%10===+c[10]; }
function tipoChave(k){ k=(k||"").trim();
  if(!k) return "";
  if(/^0002\d{2}/.test(k)) return "Pix copia e cola";
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k)) return "Chave aleatória";
  if(/@/.test(k)) return "E-mail";
  const d=k.replace(/\D/g,"");
  if(/^\+/.test(k)||(d.length>=12&&d.length<=13)) return "Telefone";
  if(d.length===11){ const cpf=cpfValido(d), cel=/^[1-9][1-9]9\d{8}$/.test(d);
    return cpf&&!cel?"CPF":cel&&!cpf?"Telefone (celular com DDD)":"CPF ou telefone"; }
  if(d.length===14) return "CNPJ";
  return "⚠ Formato não reconhecido – conferir"; }
function legenda(it){ return `${it.oc?'#'+it.oc+' | ':''}Obra ${it.obra} | ${it.forn} | ${it.desc} | ${brl(it.valor)}`; }
const _h=new Date(); const HOJE = `${_h.getFullYear()}-${String(_h.getMonth()+1).padStart(2,"0")}-${String(_h.getDate()).padStart(2,"0")}`;
function vencTxt(it){ if(!it.venc) return ""; if(it.vencISO && it.vencISO<HOJE) return `<span class="venc-alerta">VENCIDO ${esc(it.venc)}</span>`; if(it.vencISO===HOJE) return `<span class="venc-alerta">vence HOJE</span>`; return "vence "+esc(it.venc); }
function ordenar(a){ return [...a].sort((x,y)=> conta(x).localeCompare(conta(y)) || String(x.vencISO||"").localeCompare(String(y.vencISO||""))); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),1400); }
async function copiar(txt, rotulo){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); }
  toast(rotulo+" copiado");
}

// ---------- EMILY ----------
function carregandoHTML(){ return `<div class="vazio">Conectando ao lote compartilhado…</div>`; }
function renderEmily(){
  if(st.telaAcesso){ $("#app").innerHTML=st.telaAcesso; $("#rodInfo").innerHTML=""; return; }
  if(st.carregando){ $("#app").innerHTML=carregandoHTML(); $("#rodInfo").innerHTML=""; return; }
  const its = st.itens;
  const pend = its.filter(i=>i.status==="aberto" && !pronto(i)).length;
  const conf = its.filter(i=>i.status==="conferido");
  const ordem = [...its].sort((a,b)=>{
    const r = i => i.status==="recusado"?3 : i.status==="conferido"?2 : pronto(i)?1:0;
    return r(a)-r(b);
  });
  let h = `${MEU_ID?`<div class="meta" style="margin:0 2px 8px">Conectado como <b>${esc(USUARIOS[MEU_ID]||MEU_ID)}</b> · <a href="#" id="btnSair2">sair</a></div>`:''}<div class="imp">
    <p>${st.fonte==="demo" ? "Mostrando dados de demonstração. Importe o arquivo exportado do Mais Controle para testar com dados reais."
      : !st.arquivo && !its.length ? "Nenhum lote ainda. Exporte os pagamentos em aberto no Mais Controle e importe aqui."
      : `${st.shared?'<b style="color:var(--ok)">● Compartilhado</b> · ':''}Importado de <b>${esc(st.arquivo)}</b> às ${esc(st.importadoEm)}${st.importadoPor?' por '+esc(nome(st.importadoPor)):''} · ${its.length} ${its.length===1?"pagamento":"pagamentos"} em aberto`}</p>
    <div class="acoes">
      <label class="btn pri">Importar pagamentos<input type="file" accept=".csv,.xlsx,.xls" data-imp="pag" hidden></label>
      <label class="btn">Importar fornecedores (chaves Pix)<input type="file" accept=".csv,.xlsx,.xls" data-imp="forn" hidden></label>
      ${st.fonte!=="demo"&&!st.shared?'<button class="btn" id="voltaDemo">Limpar lote deste aparelho</button>':''}
    </div>
  </div>
  ${its.some(i=>i.pago)?`<div class="aviso" style="margin:-4px 2px 12px">${its.filter(i=>i.pago).length} pago(s) aguardando baixa no Mais Controle. Dê a baixa antes de exportar o próximo lote.</div>`:''}
  <div class="resumo">
    <div class="${pend?'warn':''}"><b>${pend}</b><span>para completar</span></div>
    <div><b>${its.filter(i=>i.status==="aberto"&&pronto(i)).length}</b><span>prontos p/ conferir</span></div>
    <div><b>${conf.filter(i=>!i.pago).length}</b><span>no lote a pagar</span></div>
  </div>`;
  for(const it of ordem){
    const c=conta(it), k=chave(it), f=fav(it), ok=pronto(it);
    const cls = it.status==="recusado"?"rec": it.status==="conferido"?"ok": ok?"":"pend";
    h += `<article class="item ${cls}">
      <div class="linha1"><span class="forn">${esc(it.forn)}</span><span class="valor">${brl(it.valor)}</span></div>
      <div class="meta">${[esc(it.oc), it.nf?'Doc. '+esc(it.nf):'', 'Obra '+esc(it.obra), esc(it.desc), it.etapa?esc(it.etapa):'', vencTxt(it), it.sol?'pedido por '+esc(it.sol):''].filter(Boolean).join(' · ')}</div>${alertaHist(it)}
      <div class="campos">
        <div class="campo"><label>Conta pagadora ${it.contaMC?'<span class="auto">do Mais Controle</span>':OBRA_CONTA[it.obra]?'<span class="auto">automático pela obra</span>':''}</label>
          ${c && !it.contaManual ? `<div class="val">${esc(c)}</div>` :
            `<select data-conta="${it.id}"><option value="">Escolher conta…</option>${contasLista().map(x=>`<option ${x===it.contaManual?'selected':''}>${esc(x)}</option>`).join("")}</select>`}
        </div>
        ${it.tipo==="Boleto" ? `
        <div class="campo"><label>Boleto${it.venc?' · vence '+esc(it.venc):''} ${it.linha?'<span class="auto">código da Descrição (COD:)</span>':''}</label>
          ${it.linha ? `<div class="val">${esc(k)}</div>${alertaCC(it)}` : `<input placeholder="Colar linha digitável do boleto" data-linha="${it.id}" value="${esc(it.linhaManual)}">`}</div>` : `
        <div class="campo"><label>Favorecido e chave Pix ${it.chaveAvulsa?'<span class="auto" style="color:var(--ouro)">chave informada só para este pagamento</span>':it.pixLanc?'<span class="auto">chave informada no lançamento</span>':fornCad(it).chave?'<span class="auto">do cadastro do fornecedor no Mais Controle</span>':''}</label>
          ${it.editando ? `
            <input placeholder="Chave aleatória, CPF, CNPJ, e-mail, telefone ou Pix copia e cola" data-avulsa="${it.id}" value="${esc(it.chaveAvulsa)}">

            <div class="acoes"><button class="btn pri" data-salvaavulsa="${it.id}">Salvar chave</button>
            ${it.chaveAvulsa?`<button class="btn" data-limpaavulsa="${it.id}">Voltar à chave do cadastro</button>`:''}</div>`
          : fornCad(it).chave || it.chaveAvulsa || it.pixLanc ? `<div class="val">${esc(f)}${it.cpf&&!it.pixLanc&&!it.chaveAvulsa?' · '+esc(it.cpf):''}<br>${esc(k)}${it.chaveAvulsa?`<br><span style="font-size:12px;color:var(--muted)">${esc(tipoChave(k))}${it.confirmada?' · confirmada por ligação':''}</span>`:''}</div>

            `<input placeholder="Nome do favorecido" data-fav="${it.id}" value="${esc(it.favManual)}">

        </div>`}
      </div>

      <div class="acoes">
        ${it.status==="aberto" ? `
          <button class="btn pri" data-conf="${it.id}" ${ok?'':'disabled'}>Conferido, incluir no lote</button>
          <select data-mot="${it.id}" aria-label="Motivo da recusa"><option value="">Recusar…</option>
            <option>R1 OC inexistente</option><option>R2 Valor divergente</option><option>R3 Favorecido não confere</option>

  $("#btnLote").disabled = !conf.length;

// ---------- IAGO ----------
const HIST={itens:[], carregadoEm:0, filtro:"", carregando:false};
async function carregarHist(){ if(!DB||!DB.recentes||HIST.carregando) return; HIST.carregando=true;
  try{ HIST.itens=await DB.recentes(300); HIST.carregadoEm=Date.now(); }catch(e){ toast("Não consegui carregar o histórico ("+((e&&e.code)||"erro")+")"); }
  HIST.carregando=false; if(st.modo==="hist") renderHist(); }
function renderHist(){
  if(st.telaAcesso){ $("#app").innerHTML=st.telaAcesso; return; }
  if(!DB){ $("#app").innerHTML=`<div class="vazio">Histórico disponível só na versão compartilhada.</div>`; return; }
  if(!HIST.carregadoEm){ $("#app").innerHTML=`<div class="vazio">Carregando histórico…</div>`; carregarHist(); return; }
  const f=norm(HIST.filtro);
  const lista=HIST.itens.filter(i=>!f || norm([i.forn,i.obra,i.desc,conta(i),String(i.valor)].join(" ")).includes(f));
  const dias={}; lista.forEach(i=>{ const d=i.pagoEm?new Date(i.pagoEm).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}):"sem data"; (dias[d] ||= []).push(i); });
  let h=`<div class="imp"><p>Pagamentos com baixa dada (últimos ${HIST.itens.length}). Busque por fornecedor, obra, conta ou valor.</p>
    <input id="histBusca" placeholder="Buscar…" value="${esc(HIST.filtro)}" style="width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)"></div>`;
  if(!lista.length) h+=`<div class="vazio">Nada encontrado.</div>`;
  for(const [d,arr] of Object.entries(dias)){
    h+=`<section class="conta"><div class="conta-h"><h2>${esc(d)}</h2><div class="tot"><b>${brl(arr.reduce((a,b)=>a+(+b.valor||0),0))}</b>${arr.length} ${arr.length>1?'pagamentos':'pagamento'}</div></div>`;
    for(const i of arr){ const hp=i.pagoEm?new Date(i.pagoEm).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
      h+=`<div class="pg"><div class="linha1"><span class="forn">${esc(i.forn)}</span><span class="valor">${brl(+i.valor||0)}</span></div>
        <div class="meta">${['Obra '+esc(i.obra), esc(i.desc), esc(conta(i))].filter(Boolean).join(' · ')}</div>
        <div class="meta">Pago${i.pagoPor?' por '+esc(nome(i.pagoPor)):''}${hp?' às '+hp:''} · baixa ${i.baixaPor==="export"?"detectada no export":(i.baixaPor?'por '+esc(nome(i.baixaPor)):'')}${i.baixaEm?' em '+new Date(i.baixaEm).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):''}</div></div>`; }
    h+=`</section>`; }
  $("#app").innerHTML=h;
  const b=document.getElementById("histBusca"); if(b && HIST._foco){ b.focus(); b.setSelectionRange(b.value.length,b.value.length); }
}
function renderIago(){
  if(st.telaAcesso){ $("#app").innerHTML=st.telaAcesso; $("#rodInfo").innerHTML=""; return; }
  if(st.carregando){ $("#app").innerHTML=carregandoHTML(); $("#rodInfo").innerHTML=""; return; }
  const lote = ordenar(st.itens.filter(i=> st.shared ? i.status==="conferido" : i.status!=="recusado"));
  if(!lote.length){ $("#app").innerHTML=`<div class="vazio">${st.shared?`Nenhum pagamento no lote das ${st.janela} ainda.<br>Os itens aparecem aqui assim que a Emily conferir.`:`Nenhum lote neste aparelho.<br>Importe o arquivo que a Emily mandou no grupo (modo Emily → Importar pagamentos).`}</div>`; $("#rodInfo").innerHTML=""; return; }
  const pagos = lote.filter(i=>i.pago);
  const falta = lote.filter(i=>!i.pago).reduce((a,b)=>a+b.valor,0);
  let h = `${MEU_ID?`<div class="meta" style="margin:0 2px 8px">Conectado como <b>${esc(USUARIOS[MEU_ID]||MEU_ID)}</b> · <a href="#" id="btnSair2">sair</a></div>`:''}${!st.shared?`<div class="meta" style="margin:0 2px 10px">Arquivo <b>${esc(st.arquivo)}</b> importado às ${esc(st.importadoEm)} neste aparelho. Pague só o que está na mensagem de lote da Emily.</div>`:''}<div class="progresso"><b>${pagos.length} de ${lote.length} pagos</b> · faltam ${brl(falta)}<div class="barra"><i style="width:${pagos.length/lote.length*100}%"></i></div></div>`;
  const grupos = {};
  lote.forEach(i=>{ (grupos[conta(i)] ||= []).push(i); });
  for(const [c, arr] of Object.entries(grupos)){
    const feita = arr.every(i=>i.pago);
    const tot = arr.reduce((a,b)=>a+b.valor,0);
    h += `<section class="conta ${feita?'feita':''}">
      <div class="conta-h"><h2>${esc(c)}</h2><div class="tot"><b>${brl(tot)}</b>${arr.length} ${arr.length>1?'pagamentos':'pagamento'} · abra o app 1 vez</div></div>`;
    for(const it of arr){
      h += `<div class="pg ${it.pago?'pago':''}">
        <div class="linha1"><span class="forn">${esc(it.forn)}</span><span class="valor">${brl(it.valor)}</span></div>
        <div class="meta">${['Obra '+esc(it.obra), esc(it.desc), vencTxt(it)].filter(Boolean).join(' · ')}</div>
        ${!pronto(it)?'<div class="aviso">Sem chave ou código de pagamento. Confirme com a Emily antes de pagar.</div>':''}${alertaHist(it,true)}
        ${it.tipo==="Boleto"
          ? `${alertaCC(it)}<div class="copiar"><div class="val">Boleto${it.venc?' · vence '+esc(it.venc):''}<br>${esc(chave(it))}</div><button class="btn pri" data-cp="${it.id}" data-q="chave">Copiar código</button></div>`
          : `${it.chaveAvulsa?`<div class="meta" style="color:var(--ouro);font-weight:600;margin-top:6px">Chave diferente do cadastro · ${esc(tipoChave(it.chaveAvulsa))} · confirmada pela Emily</div>`:''}${alertaCC(it)}<div class="copiar"><div class="val">${esc(fav(it))}${it.cpf&&!it.pixLanc&&!it.chaveAvulsa?' · '+esc(it.cpf):''}<br><b style="word-break:break-all">${esc(chave(it))}</b>${tipoChave(chave(it))&&!/copia/.test(tipoChave(chave(it)))?`<br><span style="font-size:12px;color:var(--muted)">${esc(tipoChave(chave(it)))}</span>`:''}</div><button class="btn pri" data-cp="${it.id}" data-q="chave">${tipoChave(chave(it))==="Pix copia e cola"?"Copiar Pix copia e cola":"Copiar chave"}</button></div>`}
        <div class="copiar"><div class="val" style="font-size:13px">${esc(legenda(it))}</div><button class="btn" data-cp="${it.id}" data-q="leg">Copiar legenda</button></div>
        <label class="check"><input type="checkbox" data-pago="${it.id}" ${it.pago?'checked':''}> ${it.pago?'Pago'+(it.pagoPor&&it.pagoPor!==MEU_ID?' por '+esc(nome(it.pagoPor)):''):'Paguei'}</label>
      </div>`;
    }
    h += `</section>`;
  }
  $("#app").innerHTML = h;
  $("#rodInfo").innerHTML = `<b>${brl(falta)}</b>restante no lote`;
  $("#btnLote").disabled = false;
}

function atualizarSelo(){ const el=document.getElementById("selo"); if(!el) return;
  el.textContent = st.telaAcesso ? "Acesso restrito" : st.carregando ? "Conectando…" : (st.arquivo ? `Lote importado às ${st.importadoEm}${st.shared?" · compartilhado":""}` : "Nenhum lote importado"); }
function render(){ salvar(); atualizarSelo(); document.getElementById("rodape").style.display = (st.telaAcesso||st.modo==="hist") ? "none" : "";
  if(st.modo==="hist"){ renderHist(); return; }
  st.modo==="emily"?renderEmily():renderIago(); $("#btnLote").textContent = st.modo==="emily"?"Gerar mensagem do lote":"Ver mensagem do lote"; }

function mensagem(){
  const lote = ordenar(st.itens.filter(i=>i.status==="conferido"));
  const d = new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  const tot = lote.reduce((a,b)=>a+b.valor,0);
  let m = `*LOTE ${d} – ${st.janela}*\n${lote.length} ${lote.length===1?"pagamento":"pagamentos"} · ${brl(tot)}\n`;
  const g={}; lote.forEach(i=>{(g[conta(i)] ||= []).push(i);});
  for(const [c,arr] of Object.entries(g)){
    m += `\n🏦 *${c.toUpperCase()}* (${brl(arr.reduce((a,b)=>a+b.valor,0))})\n`;
    arr.forEach(i=>{
      m += `\n${legenda(i)}\n`;
      m += i.tipo==="Boleto" ? `Boleto${i.venc?' vence '+i.venc:''}: ${chave(i)}\n` + (duplicado(i)?"⚠ Conferir antes de pagar: mesmo código em outro pagamento\n":"") : `Pix ${fav(i)}${i.chaveAvulsa?" (⚠ chave diferente do cadastro, confirmada)":""}: ${chave(i)}\n` + (alertaCC(i).includes("⚠")?"⚠ Conferir antes de pagar: código com valor, recebedor ou duplicidade divergente\n":"") + (i.jaPago&&i.jaPago.exato?"⚠ Este lançamento já consta como pago no histórico: confirmar antes de pagar\n":"");
    });
  }
  return m;
}

let IMP = null;
function adivinha(hs, campos){ const m={}, used=new Set();
  for(const c of campos){ for(const r of c.re){ const i=hs.findIndex((h,ix)=>!used.has(ix)&&r.test(norm(h))); if(i>=0){ m[c.k]=i; used.add(i); break; } } }
  return m; }
function lerTexto(buf){ let t=new TextDecoder("utf-8").decode(buf); if(t.includes("\uFFFD")) t=new TextDecoder("windows-1252").decode(buf); return t.replace(/^\uFEFF/,""); }
function parseCSV(t){ const l1=(t.split(/\r?\n/)[0]||""); const d=l1.split(";").length>=l1.split(",").length?";":",";
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c=='"') q=true; else if(c==d){ row.push(f); f=""; } else if(c=="\n"){ row.push(f); rows.push(row); row=[]; f=""; } else if(c!="\r") f+=c; }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!=="")); }
async function lerArquivo(file){ const buf=await file.arrayBuffer();
  if(/\.(xlsx|xls)$/i.test(file.name)){ if(!window.XLSX) throw new Error("O leitor de Excel não carregou. Exporte em CSV e tente de novo.");
    const wb=XLSX.read(buf,{type:"array",cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}).filter(r=>r.some(x=>String(x).trim()!=="")); }
  return parseCSV(lerTexto(buf)); }
function num(v){ if(typeof v==="number") return v; let s=String(v??"").replace(/R\$|\s/g,""); if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); return parseFloat(s); }
function acharCabecalho(rows){ for(let i=0;i<Math.min(rows.length,15);i++){ if(rows[i].filter(x=>typeof x==="string"&&x.trim()&&isNaN(num(x))).length>=3) return i; } return 0; }
function lerData(v){ if(v instanceof Date) return v; if(typeof v==="number"&&v>20000&&v<80000) return new Date(Math.round((v-25569)*864e5)+432e5);
  const s=String(v??"").trim(); let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m) return new Date(+(m[3].length==2?"20"+m[3]:m[3]), m[2]-1, +m[1], 12);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1], m[2]-1, +m[3], 12); return null; }
function lerPix(t){ const s=String(t||""); const cc=achaCopiaCola(s); if(cc) return {chave:cc, fav:(emv(cc)||{}).nome||""}; const m=s.match(/PIX[^:|\n]*:\s*([^|\n]+)/i), f=s.match(/FAV[^:|\n]*:\s*([^|\n]+)/i); return {chave:m?m[1].trim():"", fav:f?f[1].trim():""}; }
function emv(code){ const c=String(code||"").replace(/\r?\n/g,"").trim(); if(!/^000201/.test(c)) return null;
  const out={}; let i=0; const tags={};
  while(i+4<=c.length){ const t=c.substr(i,2), l=parseInt(c.substr(i+2,2),10); if(isNaN(l)) break; tags[t]=c.substr(i+4,l); i+=4+l; }
  out.valor = tags["54"]?parseFloat(tags["54"]):null; out.nome=(tags["59"]||"").trim(); out.cidade=(tags["60"]||"").trim();
  const ma=tags["26"]||"", sub={}; let j=0; while(j+4<=ma.length){ const t=ma.substr(j,2), l=parseInt(ma.substr(j+2,2),10); if(isNaN(l)) break; sub[t]=ma.substr(j+4,l); j+=4+l; }
  out.dinamico=!!sub["25"]; out.chave=sub["01"]||"";
  return out; }
function achaCopiaCola(t){ const m=String(t||"").replace(/\r?\n/g,"").match(/000201.+?6304[0-9A-F]{4}/i); return m?m[0]:""; }
function chaveValida(k){ const t=tipoChave(k); return !!t && !t.startsWith("⚠"); }

function abrirMapa(tipo, file, rows){
  const hi=acharCabecalho(rows), hs=rows[hi].map(x=>String(x).trim()), campos=tipo==="pag"?CAMPOS_P:CAMPOS_F;
  IMP={tipo, file:file.name, rows, hi, hs, campos, map:adivinha(hs,campos)};
  $("#mpT").textContent = tipo==="pag" ? "Conferir colunas – pagamentos" : "Conferir colunas – fornecedores";
  $("#mpInfo").textContent = `${file.name} · ${rows.length-hi-1} linhas. Confira se cada campo aponta para a coluna certa do Mais Controle.`;
  $("#mpCampos").innerHTML = campos.map(c=>`<div><label>${c.rot}${c.obr?' *':''}</label>
    <select data-map="${c.k}"><option value="">(não usar)</option>${hs.map((h,i)=>`<option value="${i}" ${IMP.map[c.k]===i?'selected':''}>${esc(h||'Coluna '+(i+1))}${rows[hi+1]&&rows[hi+1][i]!==undefined&&rows[hi+1][i]!==''?' — ex.: '+esc(String(rows[hi+1][i] instanceof Date?rows[hi+1][i].toLocaleDateString('pt-BR'):rows[hi+1][i]).slice(0,30)):''}</option>`).join("")}</select></div>`).join("");
  $("#mapa").classList.add("on");
}
async function aplicarImport(){
  document.querySelectorAll("[data-map]").forEach(s=>{ IMP.map[s.dataset.map] = s.value===""?null:+s.value; });
  const falta = IMP.campos.filter(c=>c.obr && IMP.map[c.k]==null);
  if(falta.length){ toast("Escolha a coluna de: "+falta.map(c=>c.rot).join(", ")); return; }
  const g=(r,k)=> IMP.map[k]==null ? "" : r[IMP.map[k]];
  const linhas = IMP.rows.slice(IMP.hi+1);
  if(IMP.tipo==="forn"){
    const novo={}; let n=0, tot=0;
    for(const r of linhas){ const nome=String(g(r,"nome")).trim(); if(!nome) continue; tot++;
      const razao=String(g(r,"razao")).trim(), banco=String(g(r,"banco")).trim();
      let p=lerPix(banco); if(!p.chave) p=lerPix(g(r,"coment"));
      if(!p.chave && chaveValida(banco)) p={chave:banco, fav:""};
      if(p.chave && chaveValida(p.chave)){ const v={fav:p.fav||razao||nome, chave:p.chave}; novo[nome]=v; if(razao) novo[razao]=v; n++; } }
    FORNECEDORES = st.fonte==="demo" ? novo : {...FORNECEDORES, ...novo}; indexarForn();
    $("#mapa").classList.remove("on");
    let aplicados=0;
    if(st.fonte!=="demo") for(const it of st.itens){ if(it.chaveCad) continue; const c=FORN_IDX[norm(it.forn)]; if(c&&c.chave){ gravar(it,{chaveCad:c.chave, favCad:c.fav||""}); aplicados++; } }
    render(); toast(`${n} de ${tot} fornecedores com chave Pix${aplicados?` · ${aplicados} pagamentos completados`:""}`); return;
  }
  if(st.fonte==="demo"){ FORNECEDORES={}; }
  let itens=[]; let id=1, pulados=0;
  for(const r of linhas){
    const situ=norm(g(r,"situ")); if(situ && /pag|quitad|baixad|liquidad/.test(situ) && !/aberto|a pagar/.test(situ)){ pulados++; continue; }
    if(String(g(r,"pagoem")).trim()){ pulados++; continue; }
    const valor=num(g(r,"valor")), forn=String(g(r,"forn")).trim(); if(!forn||isNaN(valor)) continue;
    if(valor===0){ pulados++; continue; }
    const dsc=String(g(r,"desc")), com=String(g(r,"coment")), nd=String(g(r,"ndoc")).trim();
    const digitos=nd.replace(/\D/g,"");
    const cod=(com.match(/COD:\s*([^|\n]+)/i)||dsc.match(/COD:\s*([^|\n]+)/i)||[])[1] || (digitos.length>=44&&digitos.length<=48?nd:"");
    let px=lerPix(com); if(!px.chave) px=lerPix(dsc);
    if(!px.chave && nd && !cod){ const p2=lerPix(nd); if(p2.chave) px=p2; else if(chaveValida(nd)) px={chave:nd,fav:""}; }
    if(!px.chave && com.trim() && chaveValida(com.trim())) px={chave:com.trim(),fav:""};
    const bancoF=String(g(r,"banco")).trim(); let pxF=lerPix(bancoF); if(!pxF.chave && chaveValida(bancoF)) pxF={chave:bancoF,fav:""};
    if(pxF.chave && !chaveValida(pxF.chave)) pxF={chave:"",fav:""};

    const tipo=(cod || /boleto/.test(norm(g(r,"forma")))) ? "Boleto" : "Pix";
    const usouND = !!nd && ((cod && cod===nd) || px.chave===nd || (achaCopiaCola(nd) && px.chave===achaCopiaCola(nd)));
    const nf = nd && !usouND ? nd : "";
    const oc=String(g(r,"oc")).trim(), pc=String(g(r,"parc")).trim(), et=String(g(r,"etapa")).trim(), cpf=String(g(r,"doc")).trim();
    const v=lerData(g(r,"venc"));
    itens.push(novoItem({ id:id++, oc: oc?"OC "+oc:(pc?"Parc. "+pc:""), obra:String(g(r,"obra")).trim()||"—", etapa:et, cpf, nf, idx:String(g(r,"indice")).trim(), chaveCad:pxF.chave||"", favCad:pxF.fav||"",
      forn, desc:dsc.split("|")[0].trim(), valor:Math.abs(valor), tipo, linha:cod?cod.trim():"", pixLanc:px.chave, favLanc:px.fav,
      venc: v?v.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):"", vencISO: v?`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`:"",
      contaMC:String(g(r,"conta")).trim(), sol:"" }));
  }
  if(!itens.length){ toast("Nenhum pagamento em aberto encontrado. Confira as colunas."); return; }
  const grupos=[], porChave={}; let unificados=0;
  for(const it of itens){ const m=/^(\d+)[.,]\d+$/.exec(it.idx||"");
    if(!m){ grupos.push(it); continue; }
    const k=[m[1], norm(it.forn), it.contaMC, it.vencISO, it.tipo].join("|");
    const g0=porChave[k];
    if(!g0){ it.partes=[{etapa:it.etapa, valor:it.valor, obra:it.obra}]; porChave[k]=it; grupos.push(it); }
    else { g0.valor=Math.round((g0.valor+it.valor)*100)/100; g0.partes.push({etapa:it.etapa, valor:it.valor, obra:it.obra});
      if(!g0.linha && it.linha) g0.linha=it.linha; if(!g0.pixLanc && it.pixLanc) g0.pixLanc=it.pixLanc; }
  }
  for(const g1 of grupos){ if(g1.partes && g1.partes.length>1){ unificados++;
      g1.etapa=g1.partes.map(p=>`${p.etapa||"—"} ${Math.round(p.valor/g1.valor*100)}%`).join(" + ");
      const obras=[...new Set(g1.partes.map(p=>p.obra))]; if(obras.length>1) g1.obra=obras.join(" + "); }
    delete g1.partes; delete g1.idx; }
  itens=grupos;
  indexarForn();
  const usados={};
  itens.forEach(n=>{ let id=fpId(n); usados[id]=(usados[id]||0)+1; if(usados[id]>1) id+="-"+usados[id]; n.id=id; });
  $("#mapa").classList.remove("on");
  const arquivo=IMP.file, hora=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  if(DB){ await sincronizarImport(itens, arquivo, hora, pulados, unificados); return; }
  const antes={}; if(st.fonte!=="demo") st.itens.forEach(o=>{ antes[o.id]=o; });
  itens.forEach(n=>{ const o=antes[n.id]; if(o) ESTADO_KEYS.forEach(k=>{ if(o[k]) n[k]=o[k]; }); });
  st.itens=itens; st.fonte="mc"; st.arquivo=arquivo; st.importadoEm=hora;
  render(); toast(itens.length+(itens.length===1?" pagamento importado":" pagamentos importados")+(unificados?` · ${unificados} divididos por etapa foram unificados`:"")+(pulados?` · ${pulados} já pagos ignorados`:""));
}

const DATA_KEYS=["oc","nf","obra","etapa","cpf","forn","desc","valor","tipo","linha","pixLanc","favLanc","venc","vencISO","contaMC","chaveCad","favCad"];
const ESTADO_KEYS=["status","motivo","pago","pagoPor","pagoEm","conferidoPor","conferidoEm","chaveAvulsa","confirmada","contaManual","chaveManual","favManual","linhaManual"];
let DB=null, USER=null, MEU_ID=null, NOMES={}, RENDER_PENDENTE=false;
const FILA={};
function hash(str,seed){ let h=seed>>>0; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),2654435761); } return (h>>>0).toString(36); }
function fpId(n){ const k=[norm(n.forn),(+n.valor).toFixed(2),n.vencISO||"",norm(n.obra),n.contaMC||"",norm(n.desc),n.oc||"",n.nf||"",n.linha||"",n.pixLanc||""].join("|");
  return "p"+hash(k,5381)+hash(k,52711); }
function limpo(o){ return JSON.parse(JSON.stringify(o)); }
function gravar(it, patch){
  Object.assign(it, patch); render();
  if(!DB) return;
  const id=it.id, campos=limpo(patch);
  FILA[id]=(FILA[id]||Promise.resolve()).then(()=>DB.doc("pagamentos/"+id).update(campos))
    .catch(e=>toast("Não foi salvo ("+((e&&e.code)||"erro")+"). Tente de novo."));
}
async function sincronizarImport(itens, arquivo, hora, pulados, unif){
  const atuais={}; st.itens.forEach(i=>{ atuais[i.id]=i; });
  const novos=new Set(itens.map(i=>i.id));
  const remover=Object.keys(atuais).filter(id=>!novos.has(id));
  let feitos=0; const total=itens.length+remover.length;
  toast("Enviando lote…");
  try{
    for(const it of itens){
      const ref=DB.doc("pagamentos/"+it.id);
      if(atuais[it.id]){ const dados={}; DATA_KEYS.forEach(k=>{ dados[k]=it[k]??""; }); await ref.update(limpo(dados)); }
      else { const {editando, ...resto}=it;
        if(DB.jaPago){ try{ const jp=await DB.jaPago(it); if(jp) resto.jaPago={em:jp.pagoEm||0, por:jp.pagoPor||"", valor:+jp.valor||0, desc:jp.desc||"", obra:jp.obra||"", exato:!!jp.exato}; }catch(e){} }
        await ref.set(limpo(resto)); }
      feitos++;
    }
    for(const id of remover){ const o=atuais[id];
      if(o && o.pago && DB.arquivar) await DB.arquivar(o,{baixaEm:Date.now(), baixaPor:"export"});
      else await DB.doc("pagamentos/"+id).delete();
      feitos++; }
    await DB.doc("config/lote").set({arquivo, importadoEm:hora, por:MEU_ID||""});
    toast(`${itens.length} em aberto sincronizados${unif?` · ${unif} divididos por etapa unificados`:""}${remover.length?` · ${remover.length} baixados saíram do lote`:""}${pulados?` · ${pulados} já pagos ignorados`:""}`);
  }catch(e){ toast(`Importação parou em ${feitos} de ${total} (${(e&&e.code)||"erro"}). Importe de novo.`); }
}

let AUTH=null;
function dupKey(it){ return [norm(it.forn), (+it.valor).toFixed(2), norm(it.obra)].join("|"); }
function adaptar(fs){ return {
  arquivar: async (it, extra)=>{ const {editando, ...d}=it; await fs.doc("historico/"+it.id).set(limpo({...d, ...extra, dupKey:dupKey(it)})); await fs.doc("pagamentos/"+it.id).delete(); },
  jaPago: async (it)=>{ const ex=await fs.doc("historico/"+it.id).get(); if(ex.exists) return {...ex.data(), exato:true};
    const q=await fs.collection("historico").where("dupKey","==",dupKey(it)).limit(10).get();
    const lim=Date.now()-45*864e5;
    const hits=q.docs.map(d=>d.data()).filter(d=>(d.pagoEm||0)>=lim).sort((a,b)=>(b.pagoEm||0)-(a.pagoEm||0));
    return hits[0]||null; },
  recentes: async (n)=> (await fs.collection("historico").orderBy("pagoEm","desc").limit(n).get()).docs.map(d=>({...d.data(), id:d.id})),
  collection:(p)=>({ onSnapshot:(next,err)=>fs.collection(p).onSnapshot(qs=>next({docs:qs.docs.map(d=>({id:d.id, exists:true, data:()=>d.data()}))}), err) }),
  doc:(p)=>{ const r=fs.doc(p); return {
    set:(d)=>r.set(d), update:(d)=>r.update(d), delete:()=>r.delete(),
    onSnapshot:(next,err)=>r.onSnapshot(ds=>next({exists:ds.exists, data:()=>ds.data()||{}}), err) }; } }; }

    const msg = c==="auth/popup-blocked"
      ? "O navegador bloqueou a janela de login. Abra este link direto no <b>Safari</b> (não pelo WhatsApp) e, se precisar, desative em Ajustes → Safari → Bloquear pop-ups."
      : "Não foi possível entrar ("+esc(c)+"). Abra o link direto no Safari e tente de novo.";
    const el=document.getElementById("msgLogin"); if(el) el.innerHTML=msg; else toast("Não foi possível entrar: "+c); }); }

function iniciarCompartilhado(){
  if(!window.firebase || String(FIREBASE_CONFIG.apiKey).startsWith("COLE")){
    telaAcesso(`<div class="vazio"><b>Configuração pendente.</b><br>Cole o bloco firebaseConfig no início do arquivo index.html.</div>`); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  AUTH=firebase.auth(); const fs=firebase.firestore();
  st.carregando=true; st.shared=true; st.fonte="mc"; FORNECEDORES={}; indexarForn(); st.itens=[];
  let desligar=[];
  AUTH.onAuthStateChanged(u=>{
    desligar.forEach(f=>{ try{f();}catch(e){} }); desligar=[];
    if(!u){ telaAcesso(`<div class="vazio"><p>Entre com a conta Google autorizada para ver o lote.</p><button class="btn pri" id="btnEntrar">Entrar com Google</button><p class="aviso" id="msgLogin" style="margin-top:12px"></p><p class="meta" style="margin-top:8px">No iPhone, abra pelo Safari. Links abertos de dentro do WhatsApp não conseguem fazer o login.</p></div>`); return; }
    const email=(u.email||"").toLowerCase();
    if(!USUARIOS[email]){ telaAcesso(`<div class="vazio"><p>A conta <b>${esc(email)}</b> não tem acesso a este lote.</p><button class="btn" id="btnSair">Sair e usar outra conta</button></div>`); return; }
    st.telaAcesso=""; MEU_ID=email; NOMES={...USUARIOS};
    USER={ profiles: async ids=>Object.fromEntries(ids.map(i=>[i,{name:USUARIOS[i]||i}])) };
    DB=adaptar(fs); st.carregando=true; render();
    desligar.push(DB.collection("pagamentos").onSnapshot(snap=>{
      const prev={}; st.itens.forEach(i=>{ prev[i.id]=i; });
      st.itens=snap.docs.map(d=>({...d.data(), id:d.id, editando:(prev[d.id]||{}).editando||false}));
      st.carregando=false; renderSeguro();
    }, e=>{ st.carregando=false; toast(e&&e.code==="permission-denied"?"Sem permissão: confira as regras do Firestore.":"Conexão com o lote perdida. Recarregue a página."); render(); }));
    desligar.push(DB.doc("config/lote").onSnapshot(sn=>{ const d=sn.exists?sn.data():{}; st.arquivo=d.arquivo||""; st.importadoEm=d.importadoEm||""; st.importadoPor=d.por||""; renderSeguro(); }, ()=>{}));
  });
}

    lerArquivo(f).then(rows=>{ if(!rows.length){ toast("Arquivo vazio"); return; } abrirMapa(tp,f,rows); }).catch(err=>toast(err.message||"Não consegui ler o arquivo")); t.value=""; }
  if(t.dataset.confirma){ st.itens.find(i=>i.id==t.dataset.confirma).confirmada=t.checked; }
  if(t.dataset.pago){ const it=st.itens.find(i=>i.id==t.dataset.pago); gravar(it,{pago:t.checked, pagoPor:t.checked?(MEU_ID||""):"", pagoEm:t.checked?Date.now():0}); if(t.checked) toast("Marcado como pago · a Emily vê na hora"); }
  if(t.dataset.chave||t.dataset.fav){ const it=st.itens.find(i=>i.id==(t.dataset.chave||t.dataset.fav)); gravar(it,{chaveManual:it.chaveManual||"", favManual:it.favManual||""}); }
  if(t.dataset.linha){ const it=st.itens.find(i=>i.id==t.dataset.linha); gravar(it,{linhaManual:it.linhaManual||""}); }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="histBusca"){ HIST.filtro=t.value; HIST._foco=true; renderHist(); HIST._foco=false; return; }
  if(t.dataset.avulsa){ const it=st.itens.find(i=>i.id==t.dataset.avulsa); it.chaveAvulsa=t.value.trim(); it.confirmada=false;
    const cb=document.querySelector(`[data-confirma="${it.id}"]`); if(cb) cb.checked=false;
    const tp=document.querySelector(`[data-tipo="${it.id}"]`); if(tp) tp.textContent=tipoChave(it.chaveAvulsa); }
  if(t.dataset.linha){ const it=st.itens.find(i=>i.id==t.dataset.linha); it.linhaManual=t.value.trim();
    const b=t.closest(".item").querySelector("[data-conf]"); if(b) b.disabled=!pronto(it); }
  if(t.dataset.chave||t.dataset.fav){
    const it=st.itens.find(i=>i.id==(t.dataset.chave||t.dataset.fav));
    if(t.dataset.chave) it.chaveManual=t.value; else it.favManual=t.value;
    const art=t.closest(".item"); const b=art.querySelector("[data-conf]");
    if(b) b.disabled=!pronto(it);
  }
});
document.addEventListener("focusout", e=>{ setTimeout(()=>{ if(RENDER_PENDENTE && !editandoAgora()){ RENDER_PENDENTE=false; render(); } else if(e.target.dataset && (e.target.dataset.chave||e.target.dataset.fav||e.target.dataset.linha)) render(); },0); });
$("#btnLote").onclick=()=>{ $("#msg").textContent=mensagem(); $("#sheet").classList.add("on"); };
$("#fechar").onclick=()=>$("#sheet").classList.remove("on");
$("#sheet").onclick=e=>{ if(e.target.id==="sheet") $("#sheet").classList.remove("on"); };
$("#cpMsg").onclick=()=>copiar(mensagem(),"Mensagem");
render();
</script>
</body>
